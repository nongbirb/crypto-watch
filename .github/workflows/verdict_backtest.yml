name: verdict backtest
# Proof Layer (docs/architect-proof-layer.md §2.2): walk-forward backtest of the Long / Wait / Avoid rule on full daily history.
on:
  schedule: [{ cron: '41 2 * * 1' }]   # weekly, Monday
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: verdictbt, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        run: node scripts/build_verdict_backtest.mjs
      - name: Validate (schema, size cap)
        run: python3 scripts/validate.py verdict_bt
      - name: Commit
        run: |
          git config user.name "data-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verdict_backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "data: verdict backtest (Actions)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
