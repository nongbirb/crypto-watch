name: calendar data
on:
  schedule: [{ cron: '23 */6 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: calendar, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 scripts/build_calendar.py
      - name: Commit
        run: |
          git config user.name "data-bot"; git config user.email "actions@users.noreply.github.com"
          git add calendar_auto.json
          git diff --cached --quiet && exit 0
          git commit -m "data: calendar (Actions)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
