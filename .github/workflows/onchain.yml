name: onchain data
on:
  schedule: [{ cron: '23 */3 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: onchain, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 scripts/build_onchain.py
      - name: Validate
        run: python3 scripts/validate.py onchain
      - name: Commit
        run: |
          git config user.name "data-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onchain.json icons/chains
          git diff --cached --quiet && exit 0
          git commit -m "data: onchain (Actions)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
