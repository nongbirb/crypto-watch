name: signal ledger
# Proof Layer (docs/architect-proof-layer.md §2.3): append state changes of every signal the app shows (closed daily candles),
# grade r1 / r7 / r30 later, prove lock time from GitHub push timestamps. Also dispatched by heartbeat.yml (skipped scheduled runs).
on:
  schedule: [{ cron: '17 */3 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }   # read-only use: GitHub repository activity API (push timestamps) for the lock proof
concurrency: { group: ledger, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history: the lock proof finds the first commit that holds each entry
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build (prove + observe + grade + summary)
        run: node scripts/build_ledger.mjs run
      - name: Validate (schema, size caps, no locked field changed vs HEAD)
        run: python3 scripts/validate.py ledger --base HEAD
      - name: Commit
        run: |
          git config user.name "data-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger
          git diff --cached --quiet && exit 0
          git commit -m "data: signal ledger (Actions)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
