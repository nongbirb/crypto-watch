name: news data
on:
  schedule: [{ cron: '7 */3 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: news, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 scripts/build_news.py
      - name: Validate
        run: python3 scripts/validate.py news
      - name: Commit
        run: |
          git config user.name "data-bot"; git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet && exit 0
          git commit -m "data: news (Actions)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
