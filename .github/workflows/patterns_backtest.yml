name: patterns backtest
on:
  schedule: [{ cron: '23 1 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: patbt, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        run: node scripts/build_patterns_backtest.mjs
      - name: Commit
        run: |
          git config user.name "data-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patterns_backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "data: patterns backtest (Actions)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
