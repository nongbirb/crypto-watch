name: screener data
on:
  schedule: [{ cron: '41 */3 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: screener, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 scripts/build_screener.py
      - name: Validate
        run: python3 scripts/validate.py screener
      - name: Commit
        run: |
          git config user.name "data-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screener.json
          git diff --cached --quiet && exit 0
          git commit -m "data: screener (Actions)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
