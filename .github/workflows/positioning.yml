name: positioning data
on:
  schedule: [{ cron: '17,47 * * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: positioning, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 scripts/build_positioning.py
      - name: Commit
        run: |
          git config user.name "data-bot"; git config user.email "actions@users.noreply.github.com"
          git add positioning.json
          git diff --cached --quiet && exit 0
          git commit -m "data: positioning (Actions)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
