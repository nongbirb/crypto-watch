name: flows data
on:
  schedule: [{ cron: '53 */2 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: flows, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Restore paged-data cache
        uses: actions/cache/restore@v4
        with: { path: scripts/.flows_cache, key: 'flows-${{ github.run_id }}', restore-keys: 'flows-' }
      - name: Build
        run: python3 scripts/build_flows.py
      - name: Save paged-data cache
        if: always()
        uses: actions/cache/save@v4
        with: { path: scripts/.flows_cache, key: 'flows-${{ github.run_id }}' }
      - name: Validate
        run: python3 scripts/validate.py flows
      - name: Commit
        run: |
          git config user.name "data-bot"; git config user.email "actions@users.noreply.github.com"
          git add flows.json
          git diff --cached --quiet && exit 0
          git commit -m "data: flows (Actions)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
