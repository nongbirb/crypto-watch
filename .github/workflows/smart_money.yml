name: smart money data
on:
  schedule: [{ cron: '7,37 * * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: smartmoney, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 scripts/build_smart_money.py
      - name: Validate
        run: python3 scripts/validate.py smart 1
      - name: Commit
        run: |
          git config user.name "data-bot"; git config user.email "actions@users.noreply.github.com"
          git add smart_money.json
          git diff --cached --quiet && exit 0
          git commit -m "data: smart money (Actions)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
