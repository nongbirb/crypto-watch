<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crypto Watch</title>
<meta name="description" content="Live crypto dashboard: prices, indicators, trade plan levels and daily analysis.">
<meta name="theme-color" content="#0b0e14" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crypto Watch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="stylesheet" href="style.css">
<script>try{const t=localStorage.getItem('cw-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="hdr" id="hdr">
  <div class="hdr-in">
    <div class="brand"><img src="icons/favicon.png" alt="" width="26" height="26"><span>Crypto Watch</span></div>
    <div class="hdr-mid">
      <span class="pill" id="status"><i></i><b>Connecting</b></span>
      <span class="upd" id="updated">Loading…</span>
    </div>
    <div class="hdr-act">
      <button class="btn-icon" id="themeBtn" aria-label="Toggle light/dark theme" title="Toggle theme"></button>
      <button class="btn-refresh" id="refreshBtn" aria-label="Refresh all data"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg><span>Refresh</span></button>
    </div>
  </div>
</header>
<main id="app">
  <section class="market" id="market" aria-label="Market overview"></section>
  <section class="card-sec">
    <div class="sec-h"><h2>Watchlist</h2><span class="sub" id="wlSub">Tap a token for charts and the trade plan</span></div>
    <div id="overview"></div>
  </section>
  <section class="card-sec" id="detailSec">
    <div class="tokbar" id="tokbar" role="tablist" aria-label="Choose token"></div>
    <div id="detail"></div>
  </section>
  <section class="card-sec">
    <details class="gloss"><summary><h2>Glossary for beginners</h2><span class="chev"></span></summary><div id="glossary"></div></details>
  </section>
  <footer class="foot">
    <p class="nfa"><b>Not financial advice.</b> For education only; crypto is very risky and you can lose everything you put in.</p>
    <p class="src" id="sources"></p>
  </footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="app.js"></script>
</body>
</html>
